name: Release CI (main only)

on:
  push:
    branches:
      - main
    paths:
      - '**/*.lagda.tex'
      - '.github/workflows/release-ci.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Agda
        uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.7.0.1'
          agda-stdlib-version: 'recommended'
          agda-defaults: |
            standard-library

      - name: Verify Agda (--safe --without-K)
        shell: bash
        run: |
          set -euo pipefail
          : > agda-compile.log
          : > agda-exit-codes.log

          find . -type f -name '*.lagda.tex' -not -path './latex/*' | sort > agda-files.txt
          if [ ! -s agda-files.txt ]; then
            echo "No .lagda.tex files found" | tee -a agda-compile.log
            exit 1
          fi

          status=0
          while IFS= read -r file; do
            display_file="${file#./}"
            safe_log_name="agda-${display_file//\//__}.log"

            echo "=== agda --safe --without-K ${display_file} ===" | tee -a agda-compile.log
            set +e
            agda --safe --without-K "$file" > "$safe_log_name" 2>&1
            exit_code=$?
            set -e

            cat "$safe_log_name" >> agda-compile.log
            echo "${display_file}: ${exit_code}" | tee -a agda-exit-codes.log
            echo "exit code: ${exit_code}" | tee -a agda-compile.log
            echo "" | tee -a agda-compile.log

            if [ "$exit_code" -ne 0 ]; then
              status="$exit_code"
              echo "::error file=${display_file}::Agda failed with exit code ${exit_code}"
              tail -n 120 "$safe_log_name"
            fi
          done < agda-files.txt

          if [ "$status" -ne 0 ]; then
            echo "Agda verification failed" | tee -a agda-compile.log
            exit "$status"
          fi

          echo "Agda verification passed for all .lagda.tex files" | tee -a agda-compile.log



      - name: Create verification manifest
        run: |
          {
            echo "=== VOID AND FORM VERIFICATION MANIFEST ==="
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit: ${{ github.sha }}"
            echo "Agda Version: 2.7.0.1"
            echo "Flags: --safe --without-K"
            echo ""
            echo "=== CHECKED SOURCES ==="
            sed 's#^./##' agda-files.txt
            echo ""
            echo "=== AGDA EXIT CODES ==="
            cat agda-exit-codes.log
            echo ""
            echo "=== AGDA OUTPUT ==="
            cat agda-compile.log
            echo ""
            echo "=== CHECKSUMS ==="
            find . -type f \( -name '*.lagda.tex' -o -name '*.agdai' \) -not -path './latex/*' | sort |
              while IFS= read -r file; do
                sha256sum "$file"
              done
          } > verification-manifest.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            *.agdai
            agda-files.txt
            agda-exit-codes.log
            verification-manifest.txt
            agda-compile.log

  release:
    name: Create release
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/

      - name: Compute SHORT_SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Compute changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "## Void and Form — ${{ steps.sha.outputs.short }}"
            echo ""
            echo "A machine-verified derivation from logical distinction to K₄,"
            echo "compiled under \`--safe --without-K\`."
            echo ""
            echo "### Included"
            echo "- **\*.agdai** — compiled Agda interfaces for every checked literate source"
            echo "- **verification-manifest.txt** — build provenance"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since $PREV_TAG"
              echo ""
              git log --no-decorate --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD"
              echo ""
            fi
            echo "---"
            echo ""
            echo "**Verify locally:**"
            echo "\`\`\`sh"
            echo "find . -type f -name '*.lagda.tex' -not -path './latex/*' | sort | while IFS= read -r file; do"
            echo "  agda --safe --without-K \"\$file\""
            echo "done"
            echo "\`\`\`"
          } > CHANGELOG.md

      - name: Create source archive
        run: git archive -o vaf-${{ steps.sha.outputs.short }}.zip HEAD

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            vaf-${{ steps.sha.outputs.short }}.zip
            artifacts/*.agdai
            artifacts/verification-manifest.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Void and Form v${{ github.run_number }} (${{ steps.sha.outputs.short }})"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            vaf-${{ steps.sha.outputs.short }}.zip
            artifacts/*.agdai
            artifacts/verification-manifest.txt
